<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Universal Command Center — Phase 1</title>
<style>
:root{
  --bg:#07080c;--sur:#0d0f16;--sur2:#12141d;--sur3:#191c28;
  --bdr:#1e2233;--bdr2:#2a2e45;
  --t1:#e8eaf0;--t2:#9aa1b8;--t3:#5a6080;
  --teal:#2dd4bf;--green:#3ddc84;--yellow:#f5c542;--red:#ff5c5c;--purple:#a78bfa;--blue:#4e9fff;
  --mono:'JetBrains Mono','SF Mono',ui-monospace,Menlo,monospace;
  --sans:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--t1);font-family:var(--sans);font-size:13px;line-height:1.5;min-height:100vh}
button{font-family:inherit;cursor:pointer;background:none;border:none;color:inherit}

/* header */
.hdr{border-bottom:1px solid var(--bdr2);padding:16px 20px;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px}
.hdr .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:3px;color:var(--teal);text-transform:uppercase}
.hdr h1{font-size:20px;font-weight:800;letter-spacing:-.3px}
.hdr .prov{font-family:var(--mono);font-size:10px;color:var(--t3)}
.lens{display:flex;gap:2px;border:1px solid var(--bdr2);border-radius:6px;overflow:hidden}
.lens button{padding:7px 14px;font-family:var(--mono);font-size:10px;letter-spacing:1.5px;color:var(--t3);background:var(--sur)}
.lens button.on{color:var(--bg);background:var(--teal);font-weight:700}

.wrap{max-width:1100px;margin:0 auto;padding:20px}

/* status dots */
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
.d-HEALTHY,.d-OPERATIONAL,.d-RUNNING{background:var(--green);box-shadow:0 0 6px var(--green)}
.d-DEGRADED,.d-IDLE{background:var(--purple)}
.d-WARNING,.d-STALLED{background:var(--yellow)}
.d-CRITICAL,.d-BLOCKED{background:var(--red)}
.pill{font-family:var(--mono);font-size:9px;letter-spacing:1px;padding:2px 8px;border-radius:10px;border:1px solid var(--bdr2);color:var(--t2)}

/* entity cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{background:var(--sur);border:1px solid var(--bdr);border-radius:8px;padding:14px;text-align:left;transition:border-color .15s;width:100%}
.card:hover{border-color:var(--teal)}
.card .type{font-family:var(--mono);font-size:9px;letter-spacing:2px;color:var(--t3);text-transform:uppercase}
.card .name{font-size:15px;font-weight:700;margin:2px 0 8px}
.card .meta{font-family:var(--mono);font-size:10px;color:var(--t2)}
.card .go{font-family:var(--mono);font-size:10px;color:var(--teal);margin-top:10px}

/* room */
.crumb{font-family:var(--mono);font-size:11px;color:var(--t3);margin-bottom:14px}
.crumb b{color:var(--t1)}
.roomhead{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;margin-bottom:6px}
.roomhead h2{font-size:24px;font-weight:800}
.back{font-family:var(--mono);font-size:10px;color:var(--teal)}

/* THE SIGNATURE: canonical id bar */
.idbar{margin:14px 0;border:1px solid var(--bdr2);border-radius:8px;background:var(--sur2);padding:12px 14px}
.idbar .lab{font-family:var(--mono);font-size:9px;letter-spacing:2px;color:var(--t3);text-transform:uppercase}
.idbar .id{font-family:var(--mono);font-size:12px;color:var(--teal);word-break:break-all;margin:4px 0 10px}
.ctxrow{display:flex;gap:6px;flex-wrap:wrap}
.ctx{padding:6px 12px;border:1px solid var(--bdr2);border-radius:6px;font-family:var(--mono);font-size:10px;color:var(--t2);background:var(--sur)}
.ctx.on{border-color:var(--teal);color:var(--teal)}
.verify{font-family:var(--mono);font-size:10px;color:var(--green);margin-top:10px}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--bdr);margin:16px 0 14px}
.tabs button{padding:7px 13px;font-size:11px;font-weight:600;color:var(--t3);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--teal);border-bottom-color:var(--teal)}

.panel{background:var(--sur);border:1px solid var(--bdr);border-radius:8px;padding:14px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 14px;font-size:12px}
.kv .k{font-family:var(--mono);font-size:10px;color:var(--t3);letter-spacing:1px;text-transform:uppercase;padding-top:2px}

.rel{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bdr);font-size:12px}
.rel:last-child{border-bottom:none}
.rel .rt{font-family:var(--mono);font-size:9px;letter-spacing:1px;color:var(--teal);border:1px solid var(--bdr2);border-radius:10px;padding:2px 8px;white-space:nowrap}
.rel .arrow{color:var(--t3)}

.evt{display:flex;gap:12px;padding:7px 0;border-bottom:1px solid var(--bdr);font-size:12px}
.evt:last-child{border-bottom:none}
.evt .ts{font-family:var(--mono);font-size:10px;color:var(--t3);white-space:nowrap;padding-top:1px}
.evt .actor{font-family:var(--mono);font-size:10px;color:var(--purple)}

.act{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--bdr)}
.act:last-child{border-bottom:none}
.act .nm{font-family:var(--mono);font-size:12px}
.dec{font-family:var(--mono);font-size:9px;letter-spacing:1px;padding:3px 10px;border-radius:10px;border:1px solid}
.dec.ALLOW{color:var(--green);border-color:var(--green)}
.dec.DENY{color:var(--red);border-color:var(--red)}
.dec.REQUIRES_APPROVAL{color:var(--yellow);border-color:var(--yellow)}
.dec.UNAVAILABLE{color:var(--t3);border-color:var(--bdr2)}
.brokernote{font-family:var(--mono);font-size:10px;color:var(--t3);margin-top:12px}

/* list lens */
table{width:100%;border-collapse:collapse}
th{font-family:var(--mono);font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--t3);text-align:left;padding:8px 10px;border-bottom:1px solid var(--bdr2)}
td{padding:9px 10px;border-bottom:1px solid var(--bdr);font-size:12px}
tr{cursor:pointer}
tr:hover td{background:rgba(45,212,191,.04)}

/* spatial lens */
.zones{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.zone{border:1px dashed var(--bdr2);border-radius:8px;padding:12px}
.zone .zn{font-family:var(--mono);font-size:9px;letter-spacing:2px;color:var(--t3);text-transform:uppercase;margin-bottom:8px}
.zone .zc{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--bdr2);border-radius:6px;padding:5px 10px;font-size:11px;background:var(--sur)}
.chip:hover{border-color:var(--teal)}

/* graph lens */
svg text{font-family:var(--mono)}
.edge{stroke:var(--bdr2);stroke-width:1.2}
.edgelab{fill:var(--t3);font-size:8px}
.node rect{fill:var(--sur);stroke:var(--bdr2);rx:6}
.node.focus rect{stroke:var(--teal)}
.node text{fill:var(--t1);font-size:10px}
.node .ntype{fill:var(--t3);font-size:7px;letter-spacing:1px}
.node{cursor:pointer}


/* agent status block */
.agent{margin:14px 0 0;border:1px solid var(--bdr2);border-radius:8px;background:linear-gradient(160deg,var(--sur2),var(--sur));padding:12px 14px}
.agent .ah{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.agent .an{font-family:var(--mono);font-size:12px;color:var(--purple);font-weight:700}
.agent .ast{font-family:var(--mono);font-size:9px;letter-spacing:1px;padding:2px 10px;border-radius:10px;border:1px solid var(--green);color:var(--green)}
.agent .ast.pulse{animation:apulse 1.6s infinite}
@keyframes apulse{0%,100%{opacity:1}50%{opacity:.45}}
.agent .kv2{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:11px}
.agent .k2{font-family:var(--mono);font-size:9px;color:var(--t3);letter-spacing:1px;text-transform:uppercase;padding-top:1px}

/* idea capture */
.idea{margin:12px 0 0;border:1px solid var(--bdr2);border-radius:8px;background:var(--sur);padding:12px 14px}
.idea .lab{font-size:13px;font-weight:700;margin-bottom:8px}
.idea .row{display:flex;gap:8px}
.idea input{flex:1;background:var(--sur3);border:1px solid var(--bdr2);border-radius:6px;color:var(--t1);
  font-family:var(--sans);font-size:12px;padding:9px 12px;outline:none}
.idea input:focus{border-color:var(--teal)}
.idea button{background:var(--teal);color:var(--bg);font-weight:800;font-size:11px;border-radius:6px;padding:9px 16px;font-family:var(--mono);letter-spacing:1px}
.idea .note{font-family:var(--mono);font-size:9px;color:var(--t3);margin-top:8px}

/* routing pipeline */
.pipe{margin-top:10px;display:none}
.pipe.on{display:block}
.step{display:flex;gap:10px;align-items:flex-start;padding:6px 0;opacity:0;transform:translateY(4px);transition:all .35s}
.step.lit{opacity:1;transform:none}
.step .tick{font-family:var(--mono);font-size:11px;color:var(--teal);min-width:14px}
.step .st{font-family:var(--mono);font-size:9px;letter-spacing:1px;color:var(--purple);text-transform:uppercase;min-width:118px;padding-top:1px}
.step .ss{font-size:11px;color:var(--t2);flex:1}
.pipe .provenance{font-family:var(--mono);font-size:9px;color:var(--t3);margin-top:8px;border-top:1px solid var(--bdr);padding-top:8px}
.draftchip{margin-top:8px;border:1px dashed var(--yellow);border-radius:6px;padding:8px 10px;font-size:11px;color:var(--t2)}
.draftchip b{font-family:var(--mono);font-size:9px;color:var(--yellow);letter-spacing:1px}

footer{border-top:1px solid var(--bdr);margin-top:30px;padding:14px 20px;font-family:var(--mono);font-size:10px;color:var(--t3);display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px}
@media(max-width:640px){.kv{grid-template-columns:1fr}.roomhead h2{font-size:19px}}
</style>
</head>
<body>

<div class="hdr">
  <div>
    <div class="eyebrow">Universal Command Center</div>
    <h1>Phase 1 — Kernel Made Visible</h1>
    <div class="prov" id="prov"></div>
  </div>
  <div class="lens" id="lens">
    <button data-lens="graph">GRAPH</button>
    <button data-lens="spatial">SPATIAL</button>
    <button data-lens="list">LIST</button>
    <button data-lens="room" class="on">ROOM</button>
  </div>
</div>

<div class="wrap" id="app"></div>

<footer>
  <div>UI renders kernel projections only · no invented state</div>
  <div>actions route through Capability Broker · ledger is append-only</div>
</footer>

<script>
const S = __STATE__;
const app = document.getElementById('app');
const byId = Object.fromEntries(S.entities.map(e=>[e.id,e]));
const ctxNames = Object.keys(S.contextEntityIds);
let view = {lens:'room', roomId:null, ctx:'NviroGear', tab:'Overview'};

document.getElementById('prov').textContent =
  'state generated ' + new Date(S.generatedAt).toLocaleString() + ' by ' + S.generatedBy;

document.getElementById('lens').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  view.lens = b.dataset.lens; view.roomId = null;
  render();
});

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function dot(s){return `<span class="dot d-${esc(s)}"></span>`}
function tsfmt(t){const d=new Date(t);return d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'})}

function openRoom(id){view.lens='room';view.roomId=id;view.tab='Overview';syncLens();render()}
function syncLens(){document.querySelectorAll('.lens button').forEach(b=>b.classList.toggle('on',b.dataset.lens===view.lens))}

/* ── ROOM LENS ─────────────────────────────────────────────── */
function renderMaster(){
  app.innerHTML = `
    <div class="crumb"><b>Master</b></div>
    <div class="grid">${S.entities.filter(e=>e.type!=='file'&&e.type!=='folder').map(e=>`
      <button class="card" data-action="room" data-id="${e.id}">
        <div class="type">${esc(e.type)}</div>
        <div class="name">${esc(e.name)}</div>
        <div class="meta">${dot(e.status)}${esc(e.status)} &nbsp;·&nbsp; ${dot(e.health)}${esc(e.health)}</div>
        <div class="go">Inspect →</div>
      </button>`).join('')}
    </div>`;
}

function renderRoom(){
  const id = view.roomId;
  if(!id){renderMaster();return}
  const e = byId[id];
  const isFocus = id === S.focusEntityId;
  const rels = S.relationships.filter(r=>r.sourceId===id||r.targetId===id);
  const events = isFocus ? S.events : [];
  const proj = isFocus ? S.contextProjections[view.ctx] : null;

  const crumbParts = ['Master'];
  if(isFocus && view.ctx!=='NviroGear') crumbParts.push(view.ctx);
  else if(isFocus) crumbParts.push('NviroGear');
  crumbParts.push(e.name);

  const idBar = isFocus ? `
    <div class="idbar">
      <div class="lab">Canonical Entity ID — identical in every context</div>
      <div class="id" id="canon">${esc(proj.entityId)}</div>
      <div class="ctxrow">${ctxNames.map(c=>`
        <button class="ctx ${c===view.ctx?'on':''}" data-action="ctx" data-ctx="${c}">${esc(c)}</button>`).join('')}
      </div>
      <div class="verify">✓ context = ${esc(view.ctx)} · projection.entityId === canonical ID · zero duplication</div>
    </div>` : '';

  const tabs = ['Overview','Relationships','Events','Health','Actions'];

  app.innerHTML = `
    <div class="crumb">${crumbParts.map((c,i)=>i===crumbParts.length-1?`<b>${esc(c)}</b>`:esc(c)).join(' › ')}</div>
    <div class="roomhead">
      <h2>${esc(e.name)}</h2>
      <button class="back" data-action="master">← back to master</button>
    </div>
    <div class="meta" style="font-family:var(--mono);font-size:11px;color:var(--t2)">
      ${dot(e.status)}${esc(e.status)} &nbsp;&nbsp; ${dot(e.health)}${esc(e.health)} &nbsp;&nbsp; <span class="pill">${esc(e.type)}</span>
    </div>
    ${idBar}
    ${agentBlock(e)}
    ${ideaBlock(e)}
    <div class="tabs">${tabs.map(t=>`<button class="${t===view.tab?'on':''}" data-action="tab" data-tab="${t}">${t}</button>`).join('')}</div>
    <div class="panel" id="tabpanel"></div>`;

  renderTab(e, rels, events, proj);
}

function agentBlock(e){
  const m = e.metadata||{};
  if(!m.currentAgent && e.type!=='agent') return '';
  const name = m.currentAgent || e.name;
  const st = m.agentState || m.state || e.status;
  return `<div class="agent">
    <div class="ah"><span class="an">⬢ ${esc(name)}</span>
      <span class="ast ${st==='WORKING'?'pulse':''}">● ${esc(st)}</span></div>
    <div class="kv2">
      <span class="k2">Current task</span><span>${esc(m.currentTask||'—')}</span>
      <span class="k2">Last action</span><span>${esc(m.lastAction||'—')}</span>
      <span class="k2">Tests</span><span>${esc(m.tests||'—')}</span>
      <span class="k2">Needs owner</span><span>${esc(m.needsOwner||'No')}</span>
    </div></div>`;
}

function ideaBlock(e){
  if(e.type!=='system' && e.type!=='application' && e.id!==S.focusEntityId) return '';
  return `<div class="idea">
    <div class="lab">🎙 Tell this project something</div>
    <div class="row">
      <input id="ideaInput" placeholder="I've got another idea — let people generate the artwork before they pick the shirt" />
      <button data-action="idea" data-room="${e.id}">SEND</button>
    </div>
    <div class="note">spoken inside ${esc(e.name)} — ARCA already knows the target · no project name required</div>
    <div class="pipe" id="pipe"></div>
    <div id="drafts"></div>
  </div>`;
}

const STEP_LABEL = {
  'idea.captured':'Idea received', 'graph.searched':'Canonical graph',
  'proposal.routed':'Broker decision', 'command.queued':'Command queue',
  'agent.plan_started':'Agent',
};

function runIdea(roomId){
  const input = document.getElementById('ideaInput');
  const typed = (input.value||'').trim();
  const pipe = document.getElementById('pipe');
  pipe.classList.add('on');

  // Replay the KERNEL-RECORDED routing trace (real events, correlationId idea-001)
  pipe.innerHTML = S.ideaTrace.map((ev,i)=>`
    <div class="step" data-i="${i}">
      <span class="tick">✓</span>
      <span class="st">${esc(STEP_LABEL[ev.type]||ev.type)}</span>
      <span class="ss">${esc(ev.summary)}</span>
    </div>`).join('') +
    `<div class="provenance">replaying kernel-recorded trace · correlationId idea-001 · every step above is a real ledger event, not UI animation-ware</div>`;

  S.ideaTrace.forEach((_,i)=>setTimeout(()=>{
    const el = pipe.querySelector('[data-i="'+i+'"]'); if(el) el.classList.add('lit');
  }, 350*(i+1)));

  // Anything the user typed becomes an HONEST draft — never fake-executed
  if(typed){
    const d = document.getElementById('drafts');
    d.innerHTML += `<div class="draftchip"><b>DRAFT · QUEUED LOCALLY</b><br>
      "${esc(typed)}"<br>
      <span style="font-family:var(--mono);font-size:9px;color:var(--t3)">
      static snapshot — will enter the command queue (draft → awaiting_approval) when the UI is connected to a live kernel</span></div>`;
    input.value='';
  }
}

function setCtx(c){view.ctx=c;render()}
function setTab(t){view.tab=t;render()}

function renderTab(e, rels, events, proj){
  const p = document.getElementById('tabpanel');
  const isFocus = e.id === S.focusEntityId;

  if(view.tab==='Overview'){
    const meta = Object.entries(e.metadata||{});
    p.innerHTML = `<div class="kv">
      <div class="k">Type</div><div>${esc(e.type)}</div>
      <div class="k">Status</div><div>${dot(e.status)}${esc(e.status)}</div>
      <div class="k">Health</div><div>${dot(e.health)}${esc(e.health)}</div>
      ${meta.map(([k,v])=>`<div class="k">${esc(k)}</div><div>${esc(v)}</div>`).join('')}
      <div class="k">Created</div><div style="font-family:var(--mono);font-size:11px">${esc(e.createdAt)}</div>
    </div>`;
  }

  if(view.tab==='Relationships'){
    const shown = (isFocus && proj) ? proj.visibleRelationships : rels;
    p.innerHTML = shown.length ? shown.map(r=>{
      const src=byId[r.sourceId], tgt=byId[r.targetId];
      const other = r.sourceId===e.id ? tgt : src;
      const dir = r.sourceId===e.id ? '→' : '←';
      return `<div class="rel">
        <span>${esc(e.name)}</span>
        <span class="arrow">${dir}</span>
        <span class="rt">${esc(r.type)}</span>
        <span class="arrow">${dir}</span>
        <button style="color:var(--teal)" data-action="room" data-id="${other.id}">${esc(other.name)}</button>
      </div>`;
    }).join('') : '<div style="color:var(--t3)">No relationships recorded.</div>';
  }

  if(view.tab==='Events'){
    p.innerHTML = events.length ? events.map(ev=>`
      <div class="evt">
        <span class="ts">${tsfmt(ev.timestamp)}</span>
        <span style="flex:1">${esc(ev.summary)}</span>
        <span class="actor">${esc(ev.actorId||'—')}</span>
      </div>`).join('') + `<div class="brokernote">one canonical ledger · same ${events.length} events visible from every context</div>`
      : '<div style="color:var(--t3)">Ledger has no events for this entity yet.</div>';
  }

  if(view.tab==='Health'){
    p.innerHTML = `<div class="kv">
      <div class="k">Observed</div><div>${dot(e.health)}${esc(e.health)}</div>
      <div class="k">Derived from</div><div>status ${esc(e.status)} → health engine</div>
      <div class="k">Propagation</div><div>if this entity turns CRITICAL, dependents via <span class="rt" style="font-size:8px">depends_on</span> degrade automatically</div>
    </div>`;
  }

  if(view.tab==='Actions'){
    const caps = (e.capabilities||[]);
    if(isFocus && caps.length){
      p.innerHTML = caps.map(c=>{
        const d = S.capabilityDecisions[c.name];
        return `<div class="act">
          <span class="nm">${esc(c.name)} <span class="pill">${esc(c.riskLevel)}</span></span>
          <span class="dec ${d?esc(d.decision):'UNAVAILABLE'}">${d?esc(d.decision):'UNAVAILABLE'}</span>
        </div>`;
      }).join('') + `<div class="brokernote">decisions made by Capability Broker at seed time · the button never grants authority · every request was logged to the ledger</div>`;
    } else {
      p.innerHTML = '<div style="color:var(--t3)">No capabilities declared. Nothing to request.</div>';
    }
  }
}

/* ── LIST LENS ─────────────────────────────────────────────── */
function renderList(){
  app.innerHTML = `
    <div class="crumb"><b>List</b> — what do I have?</div>
    <div class="panel" style="padding:0;overflow-x:auto"><table>
      <thead><tr><th>Name</th><th>Type</th><th>Status</th><th>Health</th><th>Zone</th></tr></thead>
      <tbody>${S.entities.map(e=>`
        <tr data-action="room" data-id="${e.id}">
          <td style="font-weight:600">${esc(e.name)}</td>
          <td><span class="pill">${esc(e.type)}</span></td>
          <td>${dot(e.status)}${esc(e.status)}</td>
          <td>${dot(e.health)}${esc(e.health)}</td>
          <td style="font-family:var(--mono);font-size:10px;color:var(--t3)">${esc(e.location?.logicalZone||'—')}</td>
        </tr>`).join('')}
      </tbody></table></div>`;
}

/* ── SPATIAL LENS ──────────────────────────────────────────── */
function renderSpatial(){
  const zones = {};
  S.entities.forEach(e=>{
    const z = e.location?.logicalZone || 'unzoned';
    (zones[z]=zones[z]||[]).push(e);
  });
  app.innerHTML = `
    <div class="crumb"><b>Spatial</b> — where is everything? (logical coordinate system · geographic comes later)</div>
    <div class="zones">${Object.entries(zones).map(([z,es])=>`
      <div class="zone"><div class="zn">${esc(z)}</div>
        <div class="zc">${es.map(e=>`<button class="chip" data-action="room" data-id="${e.id}">${dot(e.health)}${esc(e.name)}</button>`).join('')}</div>
      </div>`).join('')}
    </div>`;
}

/* ── GRAPH LENS ────────────────────────────────────────────── */
function renderGraph(){
  const W=1000,H=560,cx=W/2;
  const focus = byId[S.focusEntityId];
  const others = S.entities.filter(e=>e.id!==focus.id);
  const pos = {[focus.id]:{x:cx,y:H/2}};
  others.forEach((e,i)=>{
    const a = (i/others.length)*Math.PI*2 - Math.PI/2;
    pos[e.id]={x:cx+Math.cos(a)*300, y:H/2+Math.sin(a)*200};
  });
  const edges = S.relationships.map(r=>{
    const a=pos[r.sourceId],b=pos[r.targetId];
    if(!a||!b)return '';
    const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    return `<line class="edge" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"/>
      <text class="edgelab" x="${mx}" y="${my-4}" text-anchor="middle">${esc(r.type)}</text>`;
  }).join('');
  const nodes = S.entities.map(e=>{
    const p=pos[e.id]; if(!p)return '';
    const w=Math.max(90,e.name.length*7+24);
    return `<g class="node ${e.id===focus.id?'focus':''}" transform="translate(${p.x-w/2},${p.y-22})" data-action="room" data-id="${e.id}">
      <rect width="${w}" height="44"/>
      <text x="${w/2}" y="19" text-anchor="middle" font-weight="700">${esc(e.name)}</text>
      <text class="ntype" x="${w/2}" y="34" text-anchor="middle">${esc(e.type.toUpperCase())} · ${esc(e.status)}</text>
    </g>`;
  }).join('');
  app.innerHTML = `
    <div class="crumb"><b>Graph</b> — how is everything connected? · click a node to enter its room</div>
    <div class="panel" style="padding:6px;overflow-x:auto">
      <svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:700px">${edges}${nodes}</svg>
    </div>`;
}

function render(){
  syncLens();
  if(view.lens==='room') renderRoom();
  else if(view.lens==='list') renderList();
  else if(view.lens==='spatial') renderSpatial();
  else renderGraph();
}
document.addEventListener('click', function(ev){
  const t = ev.target.closest('[data-action]');
  if(!t) return;
  const a = t.getAttribute('data-action');
  if(a==='room') openRoom(t.getAttribute('data-id'));
  else if(a==='ctx') setCtx(t.getAttribute('data-ctx'));
  else if(a==='tab') setTab(t.getAttribute('data-tab'));
  else if(a==='master'){ view.roomId=null; render(); }
  else if(a==='idea') runIdea(t.getAttribute('data-room'));
});
try { render(); } catch(err){
  app.innerHTML = '<div class="panel" style="color:var(--red)">Render error: '+String(err)+'</div>';
}
</script>
</body>
</html>
